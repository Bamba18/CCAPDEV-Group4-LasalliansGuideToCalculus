<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lasallian's Guide to Calculus - Create an Account</title>

  <!-- Local Bootstrap 4.6.2 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">

  <!-- Local Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Modular Dark Mode CSS -->
  <link rel="stylesheet" href="css/darkmode.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Floating Dark Mode Toggle Button -->
  <button type="button" class="theme-fab" id="themeToggle" aria-label="Toggle theme">
    <!-- Moon Icon -->
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"></path>
    </svg>
    <!-- Sun Icon -->
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path
        d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42">
      </path>
    </svg>
  </button>

  <!-- 1. Top Pill Navigation Bar & Theme Toggle -->
  <header class="page-header py-3 py-md-4">
    <div class="page-header-inner">
      <nav class="top-nav-pill d-flex align-items-center justify-content-center">
        <a href="#" class="nav-item-btn d-flex flex-column align-items-center">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-label">HOME</span>
        </a>

        <div class="nav-divider"></div>

        <a href="#" class="nav-item-btn d-flex flex-column align-items-center">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span class="nav-label">TOPICS</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- 2. Main Sign Up Area (Centered) -->
  <main class="flex-grow-1 d-flex flex-column justify-content-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

          <!-- Heading Area -->
          <div class="text-center mb-4 px-2">
            <h1 class="welcome-heading mb-2">CREATE AN ACCOUNT</h1>
            <p class="sub-text mb-0">
              Use your university email. We detect if you are a student or a teacher.
            </p>
          </div>

          <!-- Sign Up Card -->
          <div class="card signup-card shadow-sm border-0 mx-auto">
            <div class="card-body p-4">
              <form id="signupForm" autocomplete="off" novalidate>

                <!-- First Name & Last Name Row -->
                <div class="form-row mb-3">
                  <div class="col-12 col-sm-6 mb-3 mb-sm-0">
                    <label for="firstName" class="form-label text-uppercase">FIRST NAME</label>
                    <input type="text" class="form-control pill-input" id="firstName" placeholder="Juan" required>
                  </div>
                  <div class="col-12 col-sm-6">
                    <label for="lastName" class="form-label text-uppercase">LAST NAME</label>
                    <input type="text" class="form-control pill-input" id="lastName" placeholder="Dela Cruz" required>
                  </div>
                </div>

                <!-- University Email -->
                <div class="form-group mb-2">
                  <label for="signupEmail" class="form-label text-uppercase">UNIVERSITY EMAIL</label>
                  <input type="email" class="form-control pill-input" id="signupEmail"
                    placeholder="juan_delacruz@dlsu.edu.ph" required>
                </div>

                <!-- Real-Time Role Detection Badge & Guide Note -->
                <div class="detection-wrapper d-flex flex-wrap align-items-center mb-3">
                  <span class="badge badge-detection" id="roleBadge">Student account detected</span>
                  <small class="detection-hint">Underscore (_) = student, dot (.) = teacher</small>
                </div>

                <!-- Password -->
                <div class="form-group mb-3">
                  <label for="signupPassword" class="form-label text-uppercase">PASSWORD</label>
                  <input type="password" class="form-control pill-input" id="signupPassword" placeholder="••••••••••••"
                    required>
                </div>

                <!-- Confirm Password -->
                <div class="form-group mb-4">
                  <label for="confirmPassword" class="form-label text-uppercase">CONFIRM PASSWORD</label>
                  <input type="password" class="form-control pill-input" id="confirmPassword" placeholder="••••••••••••"
                    required>
                </div>

                <!-- Action Row: Sign Up & Login Redirect -->
                <div class="d-flex align-items-center justify-content-between pt-1">
                  <button type="submit" class="btn btn-login font-weight-bold">Sign up</button>
                  <span class="no-account-text">
                    Have an account? <a href="Login.html" class="signup-link">Login</a>
                  </span>
                </div>

              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- 3. Bottom Footer -->
  <footer class="footer-dlsu text-center py-3 mt-auto">
    <div class="container">
      <small class="footer-text">
        The Lasallian's Guide to Calculus &bull; CCAPDEV Group 4 &bull; De La Salle University
      </small>
    </div>
  </footer>

  <!-- Local Scripts -->
  <script src="js/jquery-3.7.1.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmode.js"></script>

  <!-- Interactive Scripts -->
  <script>
    const ThemeController = (() => {
      const STORAGE_KEY = "theme";
      const $themeToggle = $("[data-theme-toggle]");
      const $themeLabel = $(".theme-toggle-label");

      function applyTheme(isDarkMode) {
        $("body").toggleClass("dark-mode", isDarkMode);
        $themeLabel.text(isDarkMode ? "LIGHT MODE" : "DARK MODE");
      }

      function init() {
        const savedTheme = localStorage.getItem(STORAGE_KEY) === "dark";
        applyTheme(savedTheme);

        $themeToggle.on("click", function () {
          const nextTheme = !$("body").hasClass("dark-mode");
          applyTheme(nextTheme);
          localStorage.setItem(STORAGE_KEY, nextTheme ? "dark" : "light");
        });
      }

      return { init, applyTheme };
    })();

    const SignupController = (() => {
      function init() {
        const $emailInput = $("#signupEmail");
        const $roleBadge = $("#roleBadge");

        // Live detection: dot (.) = teacher, underscore (_) = student
        $emailInput.on("input", function () {
          const val = $(this).val().toLowerCase();
          const localPart = val.split("@")[0];

          if (localPart.includes(".")) {
            $roleBadge.text("Teacher account detected");
          } else if (localPart.includes("_")) {
            $roleBadge.text("Student account detected");
          } else {
            $roleBadge.text("University account");
          }
        });

        // Form submit validation
        $("#signupForm").on("submit", function (e) {
          e.preventDefault();
          const firstName = $("#firstName").val().trim();
          const lastName = $("#lastName").val().trim();
          const email = $emailInput.val().trim();
          const password = $("#signupPassword").val();
          const confirmPassword = $("#confirmPassword").val();

          if (!firstName || !lastName || !email || !password || !confirmPassword) {
            alert("Please fill out all fields.");
            return;
          }

          if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
          }

          alert(`Account created for ${firstName} ${lastName} (${email})!`);
        });
      }

      return { init };
    })();

    $(document).ready(function () {
      ThemeController.init();
      SignupController.init();
    });
  </script>
</body>

</html>
