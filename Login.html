<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lasallian's Guide to Calculus - Log in</title>

  <!-- Local Bootstrap 4.6.2 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">

  <!-- Local Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Local Dark Mode CSS -->
  <link rel="stylesheet" href="css/darkmode.css">

</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Floating Dark Mode Toggle Button -->
  <button type="button" class="theme-fab" id="themeToggle" aria-label="Toggle theme">
    <!-- Moon Icon -->
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"></path>
    </svg>
    <!-- Sun Icon -->
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path
        d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42">
      </path>
    </svg>
  </button>

  <!-- 1. Top Pill Navigation Bar -->
  <header class="page-header py-3 py-md-4">
    <div class="page-header-inner">
      <nav class="top-nav-pill d-flex align-items-center justify-content-center">

        <!-- Home -->
        <a href="html/about.html" class="nav-item-btn d-flex flex-column align-items-center">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-label">ABOUT</span>
        </a>

        <div class="nav-divider"></div>

        <!-- Topics -->
        <a href="#" class="nav-item-btn d-flex flex-column align-items-center">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span class="nav-label">TOPICS</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- 2. Main Login Area -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-9 mx-auto">

          <div class="text-center mb-4 px-2">
            <h1 class="welcome-heading mb-2">WELCOME BACK</h1>
            <p class="sub-text mb-0">
              Log in to join classes, or <a href="#" class="link-dlsu-accent">explore the topics</a> without an account.
            </p>
          </div>

          <div class="role-toggle-container d-flex mx-auto">
            <button type="button" class="btn role-btn active w-50" id="btnStudent">STUDENT</button>
            <button type="button" class="btn role-btn w-50" id="btnTeacher">TEACHER</button>
            <button type="button" class="btn role-btn w-50" id="btnAdmin">ADMIN</button>
          </div>

          <div class="card login-card shadow-sm border-0">
            <div class="card-body p-4">
              <form id="loginForm" autocomplete="off" novalidate>
                <div class="form-group mb-3">
                  <label for="emailInput" class="form-label text-uppercase">EMAIL</label>
                  <input type="email" class="form-control pill-input" id="emailInput"
                    placeholder="student_name@dlsu.edu.ph" required>
                </div>

                <div class="form-group mb-4">
                  <label for="passwordInput" class="form-label text-uppercase">PASSWORD</label>
                  <input type="password" class="form-control pill-input" id="passwordInput" placeholder="Your password"
                    required>
                </div>

                <div class="d-flex align-items-center justify-content-between pt-1">
                  <button type="submit" class="btn btn-login font-weight-bold">Login</button>
                  <span class="no-account-text">
                    No account yet? <a href="Signup.html" class="signup-link">Sign up</a>
                  </span>
                </div>

              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- 3. Bottom Footer -->
  <footer class="footer-dlsu text-center py-3 mt-auto">
    <div class="container">
      <small class="footer-text">
        The Lasallian's Guide to Calculus &bull; CCAPDEV Group 4 &bull; De La Salle University
      </small>
    </div>
  </footer>

  <!-- Local Scripts -->
  <script src="js/jquery-3.7.1.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmode.js"></script>

  <!-- Login Logic Only -->
  <script>
    const LoginController = (() => {
      let currentRole = "student";

      function init() {
        $("#btnStudent").on("click", function (e) {
          e.preventDefault();
          currentRole = "student";
          $("#btnStudent").addClass("active");
          $("#btnTeacher").removeClass("active");
          $("#btnAdmin").removeClass("active");
          $("#emailInput").attr("placeholder", "juan_delacruz@dlsu.edu.ph");
        });

        $("#btnTeacher").on("click", function (e) {
          e.preventDefault();
          currentRole = "teacher";
          $("#btnTeacher").addClass("active");
          $("#btnStudent").removeClass("active");
          $("#btnAdmin").removeClass("active");
          $("#emailInput").attr("placeholder", "faculty.name@dlsu.edu.ph");
        });

        $("#btnAdmin").on("click", function (e) {
          e.preventDefault();
          currentRole = "admin";
          $("#btnAdmin").addClass("active");
          $("#btnStudent").removeClass("active");
          $("#btnTeacher").removeClass("active");
          $("#emailInput").attr("placeholder", "admin.name@dlsu.edu.ph");
        });

        $("#loginForm").on("submit", function (e) {
          e.preventDefault();
          const email = $("#emailInput").val().trim();
          const password = $("#passwordInput").val();

          if (!email || !password) {
            alert("Please fill in both email and password.");
            return;
          }

          // Redirect to student page or teacher page based on the current role
          if (currentRole === "student") {
            window.location.href = "Student.html";
          } else if (currentRole === "teacher") {
            window.location.href = "Teacher.html";
          } else if (currentRole === "admin") {
            window.location.href = "Admin.html";
          }

          alert("Logged in as " + currentRole.toUpperCase() + ": " + email);
        });
      }

      return { init };
    })();

    $(document).ready(function () {
      LoginController.init();
    });
  </script>
</body>

</html>
